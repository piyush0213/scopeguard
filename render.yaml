# Render Blueprint: one free web service that runs the ScopeGuard core API (Express + Socket.IO)
# and serves the built React website from the same origin.
services:
  - type: web
    name: scopeguard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix server ci && npm --prefix client ci && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://scopeguard-poqs.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_ACCEPT_HOURS
        value: "72"
      # Secrets: set in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
