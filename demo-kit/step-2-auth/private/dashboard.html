<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>My visits — BrightSmile</title><link rel="stylesheet" href="/styles.css" /></head>
<body>
  <header class="nav"><a class="brand" href="/">BrightSmile Dental</a><button id="logout">Log out</button></header>
  <section class="contact"><h2 id="hello">Your visits</h2><p>No upcoming appointments yet.</p></section>
  <script>
    fetch('/api/auth/me').then((r) => r.json()).then((d) => { if (d.user) document.getElementById('hello').textContent = `Hi ${d.user.name || d.user.email}`; });
    document.getElementById('logout').onclick = () => fetch('/api/auth/logout', { method: 'POST' }).then(() => (location.href = '/'));
  </script>
</body>
</html>
